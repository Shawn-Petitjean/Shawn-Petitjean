<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.35"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="220">
      <feFlood flood-color="#8CFFE6" flood-opacity="0.8" result="c"/>
      <feComposite in="c" in2="SourceAlpha" operator="in" result="colored"/>
      <feGaussianBlur in="colored" stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace;font-weight:500}
      .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:500}
    </style>
  </defs>
  <rect width="1200" height="220" fill="#0A0A0A"/>
  <rect x="8" y="8" width="1184" height="204" fill="#111" stroke="#2A2A2A"/>
  <rect x="8" y="8" width="180" height="34" fill="#2EF2C9" filter="url(#glow)"/>
  <text x="22" y="31" class="mono" font-size="15" font-weight="700" fill="#0A0A0A">// STACK.SYS</text>
  <text x="1176" y="31" class="mono" font-size="12" fill="#777" text-anchor="end">MODULES LOADED: 06 · MAIN: PYTHON</text>

  <!-- module cards -->
  <g class="mono">
    <!-- PYTHON (primary, big polar blue card) -->
    <rect x="36" y="64" width="356" height="124" fill="#2EF2C9" filter="url(#glow)"/>
    <text x="52" y="86" font-size="11" fill="#0A0A0A">MOD_01 · MAIN_LANG</text>
    <text x="376" y="86" font-size="11" fill="#0A0A0A" text-anchor="end">★★★★★</text>
    <text x="50" y="152" class="sans" font-size="62" font-weight="700" fill="#0A0A0A" letter-spacing="-1">Python</text>
    <text x="52" y="176" font-size="11" fill="#0A0A0A">PRIMARY · SCRIPTING · AUTOMATION · DATA</text>
    <path d="M360 128 v24 M348 140 h24" stroke="#0A0A0A" stroke-width="2"/>

    <!-- C (grey grain, secondary) -->
    <rect x="408" y="64" width="170" height="124" fill="#8A8A8A"/>
    <rect x="408" y="64" width="170" height="124" fill="#8A8A8A" filter="url(#grain)"/>
    <text x="424" y="86" font-size="11" fill="#111">MOD_02</text>
    <text x="424" y="146" class="sans" font-size="34" font-weight="700" fill="#111">C</text>
    <text x="424" y="176" font-size="11" fill="#111">42 CORE · LOW-LEVEL</text>

    <!-- dark cards -->
    <g fill="none" stroke="#3A3A3A">
      <rect x="594" y="64" width="132" height="124"/>
      <rect x="738" y="64" width="132" height="124"/>
      <rect x="882" y="64" width="132" height="124"/>
      <rect x="1026" y="64" width="138" height="124"/>
    </g>
    <g font-size="11" fill="#777">
      <text x="608" y="86">MOD_03</text><text x="752" y="86">MOD_04</text><text x="896" y="86">MOD_05</text><text x="1040" y="86">MOD_06</text>
    </g>
    <g class="sans" font-size="30" font-weight="700" fill="#E8E8E8">
      <text x="608" y="146">Shell</text><text x="752" y="146">Git</text><text x="896" y="146">Linux</text><text x="1040" y="146">Docker</text>
    </g>
    <g font-size="11" fill="#2EF2C9">
      <text x="608" y="176">BASH · ZSH</text><text x="752" y="176">VERSION CTRL</text><text x="896" y="176">UNIX · MAKE</text><text x="1040" y="176">CONTAINERS</text>
    </g>
    <path d="M1140 72 v16 M1132 80 h16" stroke="#2EF2C9" stroke-width="1.5" filter="url(#glow)"/>
  </g>
</svg>
