    <circle cx="292" cy="360" r="5"/><circle cx="304" cy="360" r="5"/><circle cx="292" cy="372" r="5"/><circle cx="304" cy="372" r="5"/>
    <circle cx="344" cy="372" r="5"/><circle cx="356" cy="360" r="5"/><circle cx="356" cy="372" r="5"/>
  </g>
  <text x="308" y="440" class="mono" font-size="12" fill="#2EF2C9">N</text>
  <text x="308" y="520" class="mono" font-size="11" fill="#2EF2C9">ELEV</text>
  <text x="314" y="534" class="mono" font-size="11" fill="#2EF2C9">42</text>
  <text x="240" y="534" class="mono" font-size="11" fill="#2EF2C9">W</text>
  <text x="404" y="534" class="mono" font-size="11" fill="#2EF2C9">E</text>

  <!-- "altitude" stack list -->
  <g class="mono" fill="#E8E8E8">
    <text x="110" y="214" font-size="13" font-style="italic">Main</text>
    <text x="110" y="230" font-size="13" fill="#2EF2C9">Python · scripts</text>
    <text x="110" y="270" font-size="13" font-style="italic">Core</text>
    <text x="110" y="286" font-size="13">C · Bash · Unix</text>
    <text x="170" y="430" font-size="13" font-style="italic" fill="#222">Kernel</text>
    <text x="170" y="446" font-size="13" fill="#222">malloc · fork</text>
