  </g>

  <!-- TITLE -->
  <text x="340" y="370" class="mono" font-size="20" fill="#C8C8C8">2024 - ∞  <tspan fill="#2EF2C9">✦✦✦</tspan></text>
  <text x="336" y="440" class="sans" font-size="72" font-weight="600" fill="#2EF2C9" letter-spacing="8" textLength="820" lengthAdjust="spacing" filter="url(#glow)">SHAWN PETITJEAN</text>
  <g fill="#666">
    <circle cx="344" cy="462" r="3"/><circle cx="354" cy="462" r="3"/><circle cx="344" cy="472" r="3"/>
