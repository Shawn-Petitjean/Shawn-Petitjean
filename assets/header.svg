<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.35"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feFlood flood-color="#8CFFE6" flood-opacity="0.85" result="c"/>
      <feComposite in="c" in2="SourceAlpha" operator="in" result="colored"/>
      <feGaussianBlur in="colored" stdDeviation="4" result="b1"/>
      <feGaussianBlur in="colored" stdDeviation="10" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="420">
      <feFlood flood-color="#8CFFE6" flood-opacity="0.7" result="c"/>
      <feComposite in="c" in2="SourceAlpha" operator="in" result="colored"/>
      <feGaussianBlur in="colored" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="spark" d="M0,-34 C3,-6 6,-3 34,0 C6,3 3,6 0,34 C-3,6 -6,3 -34,0 C-6,-3 -3,-6 0,-34Z"/>
    <style>
      .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace;font-weight:500}
      .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:500}
      .blink{animation:b 1.2s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .pulse{animation:p 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="420" fill="#0A0A0A"/>
  <rect x="16" y="16" width="1168" height="388" fill="#111"/>

  <!-- left grey grain panel -->
  <rect x="16" y="16" width="300" height="388" fill="#8A8A8A"/>
  <rect x="16" y="16" width="300" height="388" fill="#8A8A8A" filter="url(#grain)"/>
  <text x="28" y="392" class="sans" font-size="200" font-weight="700" fill="#9C9C9C" letter-spacing="-8">42</text>
  <g fill="#111">
    <circle cx="44" cy="52" r="5"/><circle cx="56" cy="52" r="5"/><circle cx="44" cy="64" r="5"/>
    <circle cx="88" cy="64" r="5"/><circle cx="100" cy="52" r="5"/>
    <circle cx="132" cy="52" r="5"/><circle cx="144" cy="52" r="5"/><circle cx="144" cy="64" r="5"/>
    <circle cx="176" cy="52" r="5"/><circle cx="176" cy="64" r="5"/><circle cx="188" cy="64" r="5"/>
  </g>
  <text x="36" y="120" class="mono" font-size="12" fill="#111">ID // 042</text>
  <text x="36" y="138" class="mono" font-size="12" fill="#111">LOC // PERPIGNAN</text>

  <!-- accent block + structure line -->
  <rect x="316" y="16" width="56" height="56" fill="#2EF2C9" filter="url(#glow-soft)"/>
  <rect x="334" y="34" width="20" height="20" fill="#0A0A0A"/>
  <path d="M372 72 V404" stroke="#2EF2C9" stroke-width="2" filter="url(#glow-soft)"/>

  <!-- top-right meta -->
  <text x="1168" y="44" class="mono" font-size="12" fill="#555" text-anchor="end">42: "SHAWN-PETITJEAN"</text>

  <!-- title block -->
  <text x="420" y="118" class="mono" font-size="18" fill="#9A9A9A">2024 — ∞  <tspan fill="#2EF2C9">✦✦✦</tspan></text>
  <text x="416" y="200" class="sans" font-size="62" font-weight="600" fill="#2EF2C9" letter-spacing="4" textLength="740" lengthAdjust="spacing" filter="url(#glow)">SHAWN PETITJEAN</text>
  <text x="420" y="248" class="sans" font-size="20" fill="#D0D0D0" letter-spacing="1">42 PERPIGNAN · PRÉSIDENT DU BDE</text>
  <text x="420" y="278" class="mono" font-size="13" fill="#777">SOFTWARE ENGINEERING TRAJECTORY</text>

  <!-- bottom row -->
  <path d="M420 320 H1160" stroke="#2A2A2A"/>
  <rect x="420" y="346" width="78" height="22" fill="#2EF2C9"/>
  <text x="459" y="362" class="mono" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle">PYTHON</text>
  <text x="514" y="362" class="mono" font-size="13" fill="#9A9A9A">C · SHELL · LINUX</text>
  <text x="1160" y="362" class="mono" font-size="12" fill="#777" text-anchor="end">SYS_ONLINE <tspan fill="#2EF2C9" class="blink">●</tspan></text>
</svg>
