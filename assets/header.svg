    <use href="#spark" x="300" y="330" transform="translate(300 330) scale(1.2) translate(-300 -330)"/>
    <use href="#spark" x="146" y="386" transform="translate(146 386) scale(.9) translate(-146 -386)"/>
    <use href="#spark" x="300" y="470" transform="translate(300 470) scale(.8) translate(-300 -470)" class="pulse"/>
    <use href="#spark" x="410" y="160" transform="translate(410 160) scale(.6) translate(-410 -160)"/>
  </g>

  <!-- center info column -->
  <g stroke="#2A2A2A" fill="none">
    <circle cx="330" cy="110" r="70"/><circle cx="330" cy="110" r="110"/>
  </g>
  <g class="mono" font-size="13" fill="#8A8A8A" text-anchor="end">
    <text x="590" y="60">Main lang:<tspan fill="#2EF2C9" dx="14">Python 3</tspan></text>
    <text x="590" y="110">Origin:<tspan fill="#C8C8C8" dx="14">Fast-food &amp; Point Chaud</tspan></text>
    <text x="590" y="146">Role:<tspan fill="#2EF2C9" dx="14">Président du BDE</tspan></text>
    <text x="590" y="210">Goal:<tspan fill="#C8C8C8" dx="14">"Turning segfaults into</tspan></text>
    <text x="590" y="228" fill="#C8C8C8">software engineering."</text>
    <text x="590" y="256" fill="#8A8A8A">— Shawn, 42 Perpignan</text>
  </g>

  <!-- right image panel -->
  <rect x="620" y="16" width="564" height="460" fill="url(#vlines)"/>
  <rect x="620" y="16" width="564" height="460" fill="#555" opacity=".35" filter="url(#grain)"/>
  <text x="1168" y="40" class="mono" font-size="12" fill="#E8E8E8" text-anchor="end">42: "SHAWN-PETITJEAN"</text>
  <!-- HUD target -->
  <circle cx="940" cy="195" r="165" fill="url(#ambient)"/>
  <g filter="url(#glow-soft)">
    <g transform="translate(940 195)" stroke="#2EF2C9" fill="none" stroke-width="1.5">
      <circle r="98" stroke="#3A3A3A"/>
      <circle r="70" stroke-dasharray="4 8" class="spin"/>
      <path d="M-116 0 H-36 M36 0 H116 M0 -116 V-36 M0 36 V116"/>
      <path d="M-28 9 L0 -13 L28 9" stroke-width="2"/>
      <path d="M-54 54 H54" stroke="#666"/>
      <path d="M-54 48 v12 M-36 51 v6 M-18 51 v6 M0 48 v12 M18 51 v6 M36 51 v6 M54 48 v12" stroke="#666"/>
    </g>
  </g>
  <g class="mono" font-size="11" fill="#2EF2C9">
    <text x="826" y="118">213</text>
    <text x="1032" y="176">ELEV</text><text x="1038" y="190">42</text>
    <text x="1032" y="224">SP</text><text x="1032" y="238">4.2</text>
    <text x="936" y="72">N</text><text x="936" y="328">S</text>
