  </g>
  <text x="340" y="510" class="sans" font-size="22" fill="#D0D0D0" letter-spacing="1">42 PERPIGNAN · PRÉSIDENT DU BDE</text>
  <text x="340" y="538" class="sans" font-size="22" fill="#D0D0D0" letter-spacing="1">SOFTWARE ENGINEERING TRAJECTORY</text>

  <!-- bottom right polar blue card -->
  <rect x="900" y="500" width="250" height="88" rx="4" fill="#2EF2C9" filter="url(#glow-soft)"/>
  <g transform="translate(940 544)" fill="none" stroke="#0A0A0A" stroke-width="3">
