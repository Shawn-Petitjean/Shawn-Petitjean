  </g>
  <text x="1060" y="527" class="mono" font-size="12" font-weight="700" fill="#0A0A0A" text-anchor="middle">SYS_ONLINE</text>
  <g fill="#0A0A0A">
    <rect x="985" y="545" width="3" height="16"/><rect x="991" y="545" width="1" height="16"/><rect x="995" y="545" width="4" height="16"/>
    <rect x="1002" y="545" width="2" height="16"/><rect x="1007" y="545" width="1" height="16"/><rect x="1011" y="545" width="3" height="16"/>
    <rect x="1017" y="545" width="1" height="16"/><rect x="1021" y="545" width="4" height="16"/><rect x="1028" y="545" width="2" height="16"/>
    <rect x="1033" y="545" width="1" height="16"/><rect x="1037" y="545" width="3" height="16"/>
