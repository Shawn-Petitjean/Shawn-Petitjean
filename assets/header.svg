<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.35"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="620">
      <feFlood flood-color="#8CFFE6" flood-opacity="0.9" result="c"/>
      <feComposite in="c" in2="SourceAlpha" operator="in" result="colored"/>
      <feGaussianBlur in="colored" stdDeviation="4.5" result="b1"/>
      <feGaussianBlur in="colored" stdDeviation="11" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="620">
      <feFlood flood-color="#8CFFE6" flood-opacity="0.75" result="c"/>
      <feComposite in="c" in2="SourceAlpha" operator="in" result="colored"/>
      <feGaussianBlur in="colored" stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8CFFE6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8CFFE6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#141414"/>
      <rect width="5" height="14" fill="#1E1E1E"/>
    </pattern>
    <pattern id="vlines" width="6" height="10" patternUnits="userSpaceOnUse">
      <rect width="6" height="10" fill="#1A1A1A"/>
      <rect width="2" height="10" fill="#2A2A2A"/>
    </pattern>
    <path id="spark" d="M0,-40 C3,-7 7,-3 40,0 C7,3 3,7 0,40 C-3,7 -7,3 -40,0 C-7,-3 -3,-7 0,-40Z"/>
    <style>
      .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace;font-weight:500}
      .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:500}
      .blink{animation:b 1.2s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .pulse{animation:p 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}
      .spin{animation:s 12s linear infinite;transform-box:fill-box;transform-origin:center}
      @keyframes s{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="620" fill="#0A0A0A"/>
  <rect x="16" y="16" width="1168" height="588" fill="#111"/>

  <!-- left column blocks -->
  <rect x="16" y="16" width="70" height="70" fill="#4A4A4A"/>
  <rect x="86" y="16" width="70" height="70" fill="#2EF2C9" filter="url(#glow-soft)"/>
  <rect x="108" y="38" width="26" height="26" fill="#0A0A0A"/>
  <rect x="16" y="86" width="250" height="90" fill="#1C1C1C"/>
  <text x="30" y="106" class="mono" font-size="11" fill="#9A9A9A">42</text>
  <path d="M130 130h16M138 122v16" stroke="#2EF2C9" stroke-width="1.5"/>
  <rect x="16" y="176" width="60" height="120" fill="url(#stripes)"/>

  <!-- grey grain panel (bottom left) -->
  <rect x="16" y="330" width="420" height="274" fill="#8A8A8A"/>
  <rect x="16" y="330" width="420" height="274" fill="#8A8A8A" filter="url(#grain)"/>
  <text x="40" y="590" class="sans" font-size="210" font-weight="700" fill="#9C9C9C" letter-spacing="-8">42</text>
  <!-- braille dots -->
  <g fill="#111">
    <circle cx="44" cy="360" r="5"/><circle cx="84" cy="360" r="5"/><circle cx="96" cy="372" r="5"/>
    <circle cx="136" cy="360" r="5"/><circle cx="148" cy="360" r="5"/><circle cx="136" cy="372" r="5"/>
