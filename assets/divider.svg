<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40">
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="40">
      <feFlood flood-color="#8CFFE6" flood-opacity="0.85" result="c"/>
      <feComposite in="c" in2="SourceAlpha" operator="in" result="colored"/>
      <feGaussianBlur in="colored" stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="spark" d="M0,-14 C1,-3 3,-1 14,0 C3,1 1,3 0,14 C-1,3 -3,1 -14,0 C-3,-1 -1,-3 0,-14Z"/>
  </defs>
  <path d="M0 20 H1200" stroke="#2EF2C9" stroke-width="2" filter="url(#glow)"/>
  <rect x="0" y="12" width="16" height="16" fill="#2EF2C9" filter="url(#glow)"/>
  <rect x="1184" y="12" width="16" height="16" fill="#4A4A4A"/>
  <g fill="#2EF2C9" filter="url(#glow)">
    <use href="#spark" x="300" y="20"/><use href="#spark" x="600" y="20"/><use href="#spark" x="900" y="20"/>
  </g>
</svg>
