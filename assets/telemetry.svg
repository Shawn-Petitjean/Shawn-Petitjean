<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#141414"/><rect width="4" height="12" fill="#222"/>
    </pattern>
    <path id="spark" d="M0,-22 C2,-4 4,-2 22,0 C4,2 2,4 0,22 C-2,4 -4,2 -22,0 C-4,-2 -2,-4 0,-22Z"/>
    <style>
      .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace}
      .bar{animation:g 2.5s ease-out forwards;transform-box:fill-box;transform-origin:left;transform:scaleX(0)}
      @keyframes g{to{transform:scaleX(1)}}
      .blink{animation:b 1.2s steps(1) infinite}@keyframes b{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="300" fill="#0A0A0A"/>
  <rect x="8" y="8" width="1184" height="284" fill="#111" stroke="#2A2A2A"/>

  <!-- header tab -->
  <rect x="8" y="8" width="210" height="34" fill="#B4FF00"/>
  <text x="22" y="31" class="mono" font-size="15" font-weight="700" fill="#0A0A0A">// TELEMETRY.LOG</text>
  <rect x="218" y="8" width="974" height="34" fill="url(#stripes)"/>
  <text x="1176" y="31" class="mono" font-size="12" fill="#777" text-anchor="end">CTRL_042 · REC <tspan fill="#B4FF00" class="blink">●</tspan></text>

  <!-- left: status lines -->
  <g class="mono" font-size="15">
    <text x="36" y="84" fill="#777">STATUS</text><text x="180" y="84" fill="#B4FF00">[ ACTIVE ]</text>
    <text x="36" y="116" fill="#777">LOC</text><text x="180" y="116" fill="#E8E8E8">42_CAMPUS</text>
    <text x="36" y="148" fill="#777">ELEV</text><text x="180" y="148" fill="#E8E8E8">42</text>
    <text x="36" y="180" fill="#777">SEC</text><text x="180" y="180" fill="#E8E8E8">BLOCK_B</text>
    <text x="36" y="226" fill="#777">ORIGIN</text><text x="180" y="226" fill="#E8E8E8">FAST-FOOD &amp; POINT CHAUD</text>
    <text x="36" y="258" fill="#777">TARGET</text><text x="180" y="258" fill="#B4FF00">SOFTWARE ENGINEERING</text>
  </g>
  <path d="M470 60 V276" stroke="#B4FF00" stroke-width="2"/>
  <use href="#spark" x="470" y="200" fill="#B4FF00"/>

  <!-- right: trajectory -->
  <text x="510" y="84" class="mono" font-size="13" fill="#777">TRAJECTORY ──────────────────────────────────────────────</text>
  <g class="mono" font-size="13">
    <text x="510" y="126" fill="#E8E8E8">PHASE_01  KITCHEN</text>
    <rect x="720" y="114" width="420" height="14" fill="#222"/>
    <rect x="720" y="114" width="420" height="14" fill="#5A5A5A" class="bar"/>
    <text x="1150" y="126" fill="#777">DONE</text>

    <text x="510" y="166" fill="#E8E8E8">PHASE_02  PISCINE 42</text>
    <rect x="720" y="154" width="420" height="14" fill="#222"/>
    <rect x="720" y="154" width="420" height="14" fill="#8A8A8A" class="bar"/>
    <text x="1150" y="166" fill="#777">DONE</text>

    <text x="510" y="206" fill="#E8E8E8">PHASE_03  COMMON CORE</text>
    <rect x="720" y="194" width="420" height="14" fill="#222"/>
    <rect x="720" y="194" width="250" height="14" fill="#B4FF00" class="bar"/>
    <text x="1150" y="206" fill="#B4FF00">RUN</text>

    <text x="510" y="246" fill="#E8E8E8">PHASE_04  SOFTWARE ENG.</text>
    <rect x="720" y="234" width="420" height="14" fill="none" stroke="#3A3A3A" stroke-dasharray="4 4"/>
    <text x="1150" y="246" fill="#555">ETA</text>
  </g>
</svg>
