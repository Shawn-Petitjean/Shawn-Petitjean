<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.35"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="220">
      <feFlood flood-color="#8CFFE6" flood-opacity="0.8" result="c"/>
      <feComposite in="c" in2="SourceAlpha" operator="in" result="colored"/>
      <feGaussianBlur in="colored" stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace;font-weight:500}
      .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:500}
    </style>
  </defs>
  <rect width="1200" height="220" fill="#0A0A0A"/>
  <rect x="8" y="8" width="1184" height="204" fill="#111" stroke="#2A2A2A"/>
  <rect x="8" y="8" width="180" height="34" fill="#2EF2C9" filter="url(#glow)"/>
  <text x="22" y="31" class="mono" font-size="15" font-weight="700" fill="#0A0A0A">// LANG.DIST</text>
  <text x="1176" y="31" class="mono" font-size="12" fill="#777" text-anchor="end">SRC: 09 REPOS · 344.7 KB · UPDATED 2026-11</text>

  <!-- distribution bar (by bytes of code) -->
  <rect x="35" y="63" width="1130" height="30" fill="none" stroke="#3A3A3A"/>
  <rect x="36" y="64" width="449" height="28" fill="#2EF2C9" filter="url(#glow)"/>
  <rect x="485" y="64" width="628" height="28" fill="#8A8A8A"/>
  <rect x="485" y="64" width="628" height="28" fill="#8A8A8A" filter="url(#grain)"/>
  <rect x="1113" y="64" width="38" height="28" fill="#E8E8E8"/>
  <rect x="1151" y="64" width="9.5" height="28" fill="#5A5A5A"/>
  <rect x="1160.5" y="64" width="3.5" height="28" fill="#2EF2C9"/>
  <g class="mono" font-size="11" font-weight="700" fill="#0A0A0A">
    <text x="48" y="82">PYTHON · MAIN</text>
    <text x="497" y="82" fill="#111">C · 42 CORE</text>
  </g>

  <!-- legend -->
  <g class="mono">
    <!-- Python -->
    <rect x="36" y="118" width="12" height="12" fill="#2EF2C9" filter="url(#glow)"/>
    <text x="56" y="129" font-size="11" fill="#777">LANG_01</text>
    <text x="36" y="164" class="sans" font-size="30" font-weight="700" fill="#E8E8E8">Python</text>
    <text x="36" y="188" font-size="12" fill="#2EF2C9">39.8% · 137.2 KB</text>

    <!-- C -->
    <rect x="262" y="118" width="12" height="12" fill="#8A8A8A"/>
    <text x="282" y="129" font-size="11" fill="#777">LANG_02</text>
    <text x="262" y="164" class="sans" font-size="30" font-weight="700" fill="#E8E8E8">C</text>
    <text x="262" y="188" font-size="12" fill="#2EF2C9">55.7% · 191.9 KB</text>

    <!-- Makefile -->
    <rect x="488" y="118" width="12" height="12" fill="#E8E8E8"/>
    <text x="508" y="129" font-size="11" fill="#777">LANG_03</text>
    <text x="488" y="164" class="sans" font-size="30" font-weight="700" fill="#E8E8E8">Makefile</text>
    <text x="488" y="188" font-size="12" fill="#2EF2C9">3.4% · 11.6 KB</text>

    <!-- Shell -->
    <rect x="714" y="118" width="12" height="12" fill="#5A5A5A"/>
    <text x="734" y="129" font-size="11" fill="#777">LANG_04 · NEW</text>
    <text x="714" y="164" class="sans" font-size="30" font-weight="700" fill="#E8E8E8">Shell</text>
    <text x="714" y="188" font-size="12" fill="#2EF2C9">0.8% · 2.9 KB</text>

    <!-- Dockerfile -->
