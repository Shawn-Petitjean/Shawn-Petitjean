    <text x="960" y="129" font-size="11" fill="#777">LANG_05 · NEW</text>
    <text x="940" y="164" class="sans" font-size="30" font-weight="700" fill="#E8E8E8">Dockerfile</text>
    <text x="940" y="188" font-size="12" fill="#2EF2C9">0.3% · 1.1 KB</text>
  </g>
  <path d="M1140 120 v16 M1132 128 h16" stroke="#2EF2C9" stroke-width="1.5" filter="url(#glow)"/>
